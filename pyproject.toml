[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "path-manager"
version = "0.1.0"
description = "Schema-driven dynamic path management system"
readme = "README.MD"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "msgpack>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
gui = [
    "PySide6>=6.0.0",
]

[project.scripts]
path-schema-editor = "path_manager.schema_editor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
